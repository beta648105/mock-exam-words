<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>모고학습앱</title>

<!-- 홈 화면에 추가 시 주소창·툴바 없는 전체화면 앱으로 실행 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="모고학습앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="icons/favicon-180.png">

<link rel="stylesheet" href="assets/style.css?v=11">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <h1>모고학습앱</h1>
      <p class="sub">모의고사 · 교과서 지문별 단어 학습</p>
    </div>
  </header>

  <div id="days" class="daygrid"></div>
  <p id="msg" class="note" hidden></p>
</div>

<script src="assets/common.js?v=11"></script>
<script>
(function () {
  const box = document.getElementById('days');
  const msg = document.getElementById('msg');

  let days = null;      // 지문 목록 (한 번만 불러온다)
  let counts = null;    // 지문별 단어 수 (한 번만 불러온다)

  async function render() {
  try {
    if (!days) days = await loadDays();
    if (!days.length) {
      msg.hidden = false;
      msg.textContent = 'data/days.json 에 지문을 추가해 주세요.';
      return;
    }

    // 지문 수만큼 순차로 기다리면 왕복이 그만큼 쌓이므로 한꺼번에 불러온다.
    if (!counts) counts = await Promise.all(days.map(d =>
      getJSON(DATA_DIR + d.file).then(w => w.length)
                                .catch(() => 0)   // 파일이 아직 없으면 0개
    ));

    // 외움 개수는 매번 저장소에서 다시 읽어 최신 상태로 그린다.
    box.innerHTML = '';
    days.forEach((d, i) => {
      const total = counts[i];
      const known = getKnown(d.day).size;
      const score = getScore(d.day);
      const pct = total ? Math.round(known / total * 100) : 0;

      const a = document.createElement('a');
      a.className = 'daycard';
      a.href = 'day.html?day=' + encodeURIComponent(d.day);
      a.innerHTML =
        '<div class="num">' + escapeHTML(d.title || d.day) + '</div>' +
        '<div class="meta">' + total + '단어 · 외움 ' + known + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        (score
          ? '<div class="score">최근 테스트 ' +
            Math.round(score.correct / score.total * 100) + '점</div>'
          : '');
      box.appendChild(a);
    });
  } catch (e) {
    msg.hidden = false;
    msg.textContent = e.message;
  }
  }

  // 처음 열 때, 그리고 지문 화면에서 뒤로 돌아오거나 앱을 다시 열 때마다
  // 다시 그린다. 뒤로가기는 캐시에서 복원돼 스크립트가 다시 돌지 않으므로
  // pageshow 가 없으면 외움 현황이 옛날 값으로 남는다.
  window.addEventListener('pageshow', render);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) render();
  });
})();
</script>
</body>
</html>
