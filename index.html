<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>모고학습앱</title>

<!-- 홈 화면에 추가 시 주소창·툴바 없는 전체화면 앱으로 실행 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="모고학습앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="icons/favicon-180.png">

<link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <h1>모고학습앱</h1>
      <p class="sub">모의고사 기출 단어 · Day 별 학습</p>
    </div>
  </header>

  <div id="days" class="daygrid"></div>
  <p id="msg" class="note" hidden></p>
</div>

<script src="assets/common.js?v=3"></script>
<script>
(async function () {
  const box = document.getElementById('days');
  const msg = document.getElementById('msg');

  try {
    const days = await loadDays();
    if (!days.length) {
      msg.hidden = false;
      msg.textContent = 'data/days.json 에 Day 를 추가해 주세요.';
      return;
    }

    for (const d of days) {
      let total = 0;
      try {
        total = (await getJSON(DATA_DIR + d.file)).length;
      } catch (e) { /* 파일이 아직 없으면 0개로 표시 */ }

      const known = getKnown(d.day).size;
      const score = getScore(d.day);
      const pct = total ? Math.round(known / total * 100) : 0;

      const a = document.createElement('a');
      a.className = 'daycard';
      a.href = 'day.html?day=' + encodeURIComponent(d.day);
      a.innerHTML =
        '<div class="num">' + escapeHTML(d.title || ('Day ' + d.day)) + '</div>' +
        '<div class="meta">' + total + '단어 · 외움 ' + known + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        (score
          ? '<div class="score">최근 테스트 ' +
            Math.round(score.correct / score.total * 100) + '점</div>'
          : '');
      box.appendChild(a);
    }
  } catch (e) {
    msg.hidden = false;
    msg.textContent = e.message;
  }
})();
</script>
</body>
</html>
