<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>모고 단어장</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <h1>모고 단어장</h1>
      <p class="sub">모의고사 기출 단어 · Day 별 학습</p>
    </div>
  </header>

  <div id="days" class="daygrid"></div>
  <p id="msg" class="note" hidden></p>
</div>

<script src="assets/common.js"></script>
<script>
(async function () {
  const box = document.getElementById('days');
  const msg = document.getElementById('msg');

  try {
    const days = await loadDays();
    if (!days.length) {
      msg.hidden = false;
      msg.textContent = 'data/days.json 에 Day 를 추가해 주세요.';
      return;
    }

    for (const d of days) {
      let total = 0;
      try {
        total = (await getJSON(DATA_DIR + d.file)).length;
      } catch (e) { /* 파일이 아직 없으면 0개로 표시 */ }

      const known = getKnown(d.day).size;
      const score = getScore(d.day);
      const pct = total ? Math.round(known / total * 100) : 0;

      const a = document.createElement('a');
      a.className = 'daycard';
      a.href = 'day.html?day=' + encodeURIComponent(d.day);
      a.innerHTML =
        '<div class="num">' + escapeHTML(d.title || ('Day ' + d.day)) + '</div>' +
        '<div class="meta">' + total + '단어 · 외움 ' + known + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        (score
          ? '<div class="score">최근 테스트 ' +
            Math.round(score.correct / score.total * 100) + '점</div>'
          : '');
      box.appendChild(a);
    }
  } catch (e) {
    msg.hidden = false;
    msg.textContent = e.message;
  }
})();
</script>
</body>
</html>
