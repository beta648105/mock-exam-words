<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Day · 모고학습앱</title>

<!-- 홈 화면에 추가 시 주소창·툴바 없는 전체화면 앱으로 실행 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="모고학습앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="icons/favicon-180.png">

<link rel="stylesheet" href="assets/style.css?v=6">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="back" href="index.html" aria-label="목록으로">←</a>
    <div>
      <h1 id="dayTitle">Day</h1>
      <p class="sub" id="daySub">불러오는 중…</p>
    </div>
  </header>

  <p id="msg" class="note" hidden></p>

  <div id="app" hidden>
    <div class="tabs" role="tablist">
      <button id="tabList" role="tab" aria-selected="true" aria-controls="panelList">단어장</button>
      <button id="tabCard" role="tab" aria-selected="false" aria-controls="panelCard">암기</button>
      <button id="tabQuiz" role="tab" aria-selected="false" aria-controls="panelQuiz">테스트</button>
    </div>

    <!-- ===== 단어장 ===== -->
    <section id="panelList" class="panel" role="tabpanel">
      <div class="row" style="margin-bottom:12px">
        <span class="chip" id="knownChip">외움 0 / 0</span>
        <span class="spacer"></span>
        <label class="toggle">
          <input type="checkbox" id="blurMeaning"> 뜻 가리기
        </label>
        <button class="btn" id="resetKnown">외움 초기화</button>
      </div>
      <div class="bar" style="margin:0 0 14px"><i id="knownBar"></i></div>
      <div class="list" id="wordList"></div>
    </section>

    <!-- ===== 암기 카드 ===== -->
    <section id="panelCard" class="panel" role="tabpanel" hidden>
      <div class="row" style="margin-bottom:10px">
        <button class="btn" id="dirBtn">영어 → 뜻</button>
        <button class="btn" id="shuffleBtn">섞기</button>
        <span class="spacer"></span>
        <label class="toggle">
          <input type="checkbox" id="onlyUnknown"> 못 외운 것만
        </label>
      </div>

      <div class="cardstage">
        <div class="cardslide" id="cardSlide">
          <div class="card" id="card">
            <div class="face front">
              <div class="big" id="cardFront"></div>
              <div class="hint">탭하거나 스페이스바로 뒤집기</div>
            </div>
            <div class="face back">
              <div class="big" id="cardBack"></div>
              <div class="hint" id="cardBackSub"></div>
            </div>
          </div>
        </div>
      </div>

      <p class="counter" id="cardCounter"></p>

      <div class="row center" style="margin-top:14px">
        <button class="btn" id="prevBtn">← 이전</button>
        <button class="btn primary" id="knownBtn">외웠어요 ★</button>
        <button class="btn" id="nextBtn">다음 →</button>
      </div>
      <p class="kbd-hint">← → 이동 · Space 뒤집기 · Enter 외움 표시</p>
    </section>

    <!-- ===== 테스트 ===== -->
    <section id="panelQuiz" class="panel" role="tabpanel" hidden>
      <!-- 시작 화면 -->
      <div id="quizIntro" class="result">
        <div class="label">단어를 보고 뜻을 타이핑하세요</div>
        <div class="score" id="introCount">0</div>
        <div class="label">문항</div>
        <div class="row center" style="margin-top:18px">
          <label class="toggle"><input type="checkbox" id="quizShuffle" checked> 순서 섞기</label>
          <label class="toggle"><input type="checkbox" id="quizReverse"> 뜻 → 영어</label>
        </div>
        <div class="row center" style="margin-top:16px">
          <button class="btn primary" id="startBtn">테스트 시작</button>
          <button class="btn" id="startWrongBtn" hidden>지난 오답만 (0)</button>
        </div>
      </div>

      <!-- 진행 화면 -->
      <div id="quizPlay" hidden>
        <div class="quizmeta">
          <span id="qProgress">1 / 6</span>
          <span id="qScore">정답 0</span>
        </div>
        <div class="bar" style="margin:0 0 14px"><i id="qBar"></i></div>

        <div class="quizcard">
          <div class="label" id="qLabel" style="font-size:13px;color:var(--text-dim)">뜻을 입력하세요</div>
          <div class="q" id="qWord"></div>
          <input class="answer" id="qInput" type="text" autocomplete="off"
                 autocapitalize="off" spellcheck="false" placeholder="정답 입력 후 Enter">
          <div class="feedback" id="qFeedback"></div>
          <div class="row center">
            <button class="btn" id="qSkip">모르겠어요</button>
            <button class="btn primary" id="qSubmit">확인</button>
          </div>
        </div>
        <div class="row center" style="margin-top:12px">
          <button class="btn" id="qQuit">그만두기</button>
        </div>
      </div>

      <!-- 결과 화면 -->
      <div id="quizResult" hidden class="result">
        <div class="label">점수</div>
        <div class="score" id="rScore">0</div>
        <div class="label" id="rDetail"></div>
        <div class="wrongbox" id="rWrongBox" hidden>
          <h3>틀린 단어</h3>
          <div id="rWrongList"></div>
        </div>
        <div class="row center" style="margin-top:18px">
          <button class="btn primary" id="rRetryWrong">오답만 다시</button>
          <button class="btn" id="rRetryAll">처음부터</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="assets/common.js?v=6"></script>
<script src="assets/day.js?v=6"></script>
</body>
</html>
